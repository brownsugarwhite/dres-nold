# Baut die Seite und spielt sie auf Cloudflare Pages auf.
#
# Läuft
#   • bei jedem Push auf main (auch bei jedem Speichern aus der Redaktion,
#     denn das ist ein Commit)
#   • täglich um 03:00 UTC — damit die Hinweis-Blase am Stichtag
#     erscheint bzw. verschwindet (sie wird beim Bauen ausgewertet)
#   • von Hand über „Run workflow" auf GitHub
#
# Braucht zwei Secrets im Repo (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   Token mit „Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  Konto-ID aus dem Cloudflare-Dashboard

name: Veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bauen-und-aufspielen:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Keine fremden Ressourcen im HTML
        run: node scripts/pruefe-externe-ressourcen.mjs

      - name: Auf Cloudflare Pages aufspielen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name dres-nold --branch main --commit-dirty=true
